[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytbdownload"
version = "0.1.0"
description = "Download YouTube videos, playlists, and channels"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]"]

[project.scripts]
yt-download = "download:main"

[tool.setuptools]
py-modules = ["download"]
